      display: inline-block;

      height: 1.1rem;

    }

    #formReclamo .ritorno-toggle label {

    #formReclamo .giorno-opzione label {
      display: inline;
      margin: 0;
      color: #333;
      font-size: 0.9rem;
      font-style: normal;
      letter-spacing: normal;
      text-transform: none;

  <script src="https://unpkg.com/i18next@22.4.10/i18next.min.js"></script>
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>
  <script src="https://www.google.com/recaptcha/api.js"></script>
  <script>
    function timestamp() { var response = document.getElementById("g-recaptcha-response"); if (response == null || response.value.trim() == "") { var elems = JSON.parse(document.getElementsByName("captcha_settings")[0].value); elems["ts"] = JSON.stringify(new Date().getTime()); document.getElementsByName("captcha_settings")[0].value = JSON.stringify(elems); } } setInterval(timestamp, 500);
  </script>
  <script src="webToCaseUtils.js"></script>
  <script src="autorizzazione_scuole_traduzioni.js"></script>
  <script>
    var lang;
    let t;

    const requiredFields = [
      "nome",
      "cognome",
      "mail",
      "numerotesserinoidentificativo",
      "nomeintestatario",
      "cognomeintestatario",
      "percorsoabbonamento",
      "linea_andata",
      "orario_partenza_andata",
      "partenza_andata",
      "arrivo_andata",
      "linea_ritorno",
      "orario_partenza_ritorno",
      "partenza_ritorno",
      "arrivo_ritorno",
      "privacy"
    ];

    var fields = [];

    document.addEventListener("DOMContentLoaded", () => {
      fields = estraiCampiDaLabel();
      const checkboxRitorno = document.getElementById("ritorno");
      const campiRitorno = document.getElementById("campiRitorno");
      const chiaviCampiObbligatoriRitorno = [
        "linea_ritorno",
        "orario_partenza_ritorno",
        "partenza_ritorno",
        "arrivo_ritorno"
      ];
      const aggiornaCampiRitorno = () => {
        const ritornoAttivo = Boolean(checkboxRitorno?.checked);
        if (campiRitorno) campiRitorno.hidden = !ritornoAttivo;
        document.getElementById("label_giorni_andata")?.classList.add("required-day-group");
        document.getElementById("label_giorni_ritorno")
          ?.classList.toggle("required-day-group", ritornoAttivo);

        chiaviCampiObbligatoriRitorno.forEach(key => {
          const label = document.getElementById(`label_${key}`);
          label?.classList.toggle("required", ritornoAttivo);

          if (!ritornoAttivo && key !== "giorni_ritorno") {
            const input = document.getElementById(key);
            if (input) input.value = "";
          }
        });

        if (!ritornoAttivo) {
          document.querySelectorAll("#gruppo_giorni_ritorno input[type=\"checkbox\"]").forEach(input => {
            input.checked = false;
            input.removeAttribute("aria-invalid");
          });
          const erroreGiorniRitorno = document.getElementById("error_giorni_ritorno");
          if (erroreGiorniRitorno) {
            erroreGiorniRitorno.textContent = "";
            erroreGiorniRitorno.style.display = "none";
          }
        }
      };
      checkboxRitorno?.addEventListener("change", aggiornaCampiRitorno);

      ["andata", "ritorno"].forEach(direzione => {
        document.querySelectorAll(`#gruppo_giorni_${direzione} input[type="checkbox"]`).forEach(input => {
          input.addEventListener("change", () => {
            const errore = document.getElementById(`error_giorni_${direzione}`);
            if (errore?.style.display === "block") {
              const richiesto = direzione === "andata" || Boolean(checkboxRitorno?.checked);
              validaGiorni(direzione, richiesto, false);
            }
          });
        });
      });

      const langParam = new URLSearchParams(location.search).get("lang");
      lang = langParam || "it";
      if (langParam) {
        document.getElementById("languageSwitcher")?.style.setProperty("display", "none");
      }

      i18next.init({ lng: lang, resources }, (_, tInstance) => {
        t = tInstance;
        aggiornaEtichette(t, fields);
        aggiornaCampiRitorno();

        const prefissiUrl = "prefissi.json";
        caricaPrefissiTelefonici("00NbU0000002837", prefissiUrl, t);
        aggiungiConfermaEmail();

        (async () => {
          const contesto = await raccogliTracciamentoDatiConsenso();
          const json = JSON.stringify(contesto, null, 2);
          console.log('JSON dei dati raccolti:\n', json);
          document.getElementById("00NbU0000004ild").value = json;
        })();

        document.getElementById("languageSwitcher")?.addEventListener("change", e => {
          const newLang = e.target.value;
          lang = newLang;
          i18next.changeLanguage(newLang, () => {
            const newT = i18next.t.bind(i18next);
            aggiornaEtichette(newT, fields);
            aggiornaCampiRitorno();
            ["andata", "ritorno"].forEach(direzione => {
              const errore = document.getElementById(`error_giorni_${direzione}`);
              if (errore?.style.display === "block") {
                const richiesto = direzione === "andata" || Boolean(checkboxRitorno?.checked);
                validaGiorni(direzione, richiesto, false);
              }
            });
            aggiungiConfermaEmail();
          });
        });

        document.getElementById("formReclamo")?.addEventListener("submit", e => {
          const descrizione = document.getElementById("description");
          if (descrizione) descrizione.value = creaRiepilogoSoluzione();

          const validCampi = validazioneCampiObbligatori("formReclamo", t);
          const validGiorniAndata = validaGiorni("andata", true, validCampi);
          const validGiorniRitorno = validaGiorni(
            "ritorno",
            Boolean(checkboxRitorno?.checked),
            validCampi && validGiorniAndata
          );
          const validCaptcha = validaCaptcha(t, "captchaError");

          if (!validCampi || !validGiorniAndata || !validGiorniRitorno || !validCaptcha) {
            e.preventDefault();
            return;
          }
        });
      });
    });

    function validaGiorni(direzione, richiesto, mettiFocus) {
      const gruppo = document.getElementById(`gruppo_giorni_${direzione}`);
      const checkbox = [...(gruppo?.querySelectorAll('input[type="checkbox"]') || [])];
      const validi = !richiesto || checkbox.some(input => input.checked);
      const errore = document.getElementById(`error_giorni_${direzione}`);
      const messaggio =
        (typeof t === "function" ? t("labels.erroreCampoObbligatorio") : "") ||
        (lang === "en" ? "This field is required." : "Questo campo è obbligatorio.");

      checkbox.forEach(input => {
        if (validi) input.removeAttribute("aria-invalid");
        else input.setAttribute("aria-invalid", "true");
      });

      if (errore) {
        errore.textContent = validi ? "" : messaggio;
        errore.style.display = validi ? "none" : "block";
      }
      if (!validi && mettiFocus) checkbox[0]?.focus();
      return validi;
    }

    function giorniSelezionati(direzione) {
      const nomiGiorni = {
        lunedi: "lunedì",
        martedi: "martedì",
        mercoledi: "mercoledì",
        giovedi: "giovedì",
        venerdi: "venerdì",
        sabato: "sabato",
        domenica: "domenica"
      };
      const gruppo = document.getElementById(`gruppo_giorni_${direzione}`);
      return [...(gruppo?.querySelectorAll('input[type="checkbox"]:checked') || [])]
        .map(input => nomiGiorni[input.value])
        .filter(Boolean)
        .join(", ");
    }

    function creaRiepilogoSoluzione() {
      const valore = id => document.getElementById(id)?.value.trim() || "";
      const creaSezione = (titolo, direzione) => {
        const note = valore(`note_${direzione}`);
        return [
          titolo,
          `Linea: ${valore(`linea_${direzione}`)}`,
          `Giorni: ${giorniSelezionati(direzione)}`,
          `Partenza: ${valore(`orario_partenza_${direzione}`)} - ${valore(`partenza_${direzione}`)}`,
          `Arrivo: ${valore(`arrivo_${direzione}`)}`,
          note ? `Note: ${note}` : ""
        ].filter(Boolean).join("\n");
      };

      const sezioni = [creaSezione("ANDATA", "andata")];
      if (document.getElementById("ritorno")?.checked) {
        sezioni.push(creaSezione("RITORNO", "ritorno"));
      }
      return sezioni.join("\n\n");
    }
  </script>
</head>
