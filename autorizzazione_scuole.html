<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form estensione abbonamento scolastico</title>
  <link rel="stylesheet" href="webToCaseStyle.css" />
  <link rel="stylesheet" href="toggleConsensi.css" />

  <script src="https://unpkg.com/i18next@22.4.10/i18next.min.js"></script>
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <script src="https://unpkg.com/tippy.js@6"></script>
  <script src="https://www.google.com/recaptcha/api.js"></script>
  <script>
    function timestamp() { var response = document.getElementById("g-recaptcha-response"); if (response == null || response.value.trim() == "") { var elems = JSON.parse(document.getElementsByName("captcha_settings")[0].value); elems["ts"] = JSON.stringify(new Date().getTime()); document.getElementsByName("captcha_settings")[0].value = JSON.stringify(elems); } } setInterval(timestamp, 500);
  </script>
  <script src="webToCaseUtils.js"></script>
  <script src="autorizzazione_scuole_traduzioni.js"></script>
  <script>
    var lang;
    let t;

    const requiredFields = [
      "nome",
      "cognome",
      "mail",
      "numerotesserinoidentificativo",
      "nomeintestatario",
      "cognomeintestatario",
      "percorsoabbonamento",
      "descrizione",
      "privacy"
    ];

    var fields = [];

    document.addEventListener("DOMContentLoaded", () => {
      fields = estraiCampiDaLabel();

      const langParam = new URLSearchParams(location.search).get("lang");
      lang = langParam || "it";
      if (langParam) {
        document.getElementById("languageSwitcher")?.style.setProperty("display", "none");
      }

      i18next.init({ lng: lang, resources }, (_, tInstance) => {
        t = tInstance;
        aggiornaEtichette(t, fields);

        const prefissiUrl = "prefissi.json";
        caricaPrefissiTelefonici("00NbU0000002837", prefissiUrl, t);
        aggiungiConfermaEmail();

        (async () => {
          const contesto = await raccogliTracciamentoDatiConsenso();
          const json = JSON.stringify(contesto, null, 2);
          console.log('JSON dei dati raccolti:\n', json);
          document.getElementById("00NbU0000004ild").value = json;
        })();

        document.getElementById("languageSwitcher")?.addEventListener("change", e => {
          const newLang = e.target.value;
          lang = newLang;
          i18next.changeLanguage(newLang, () => {
            const newT = i18next.t.bind(i18next);
            aggiornaEtichette(newT, fields);
            aggiungiConfermaEmail();
          });
        });

        document.getElementById("formReclamo")?.addEventListener("submit", e => {
          const validCampi = validazioneCampiObbligatori("formReclamo", t);
          const validCaptcha = validaCaptcha(t, "captchaError");

          if (!validCampi || !validCaptcha) {
            e.preventDefault();
            return;
          }
        });
      });
    });
  </script>
</head>

<body>
  <div class="form-container">
    <select id="languageSwitcher">
      <option value="it">🇮🇹 Italiano</option>
      <option value="en">🇬🇧 English</option>
    </select>
    <br>
    <form id="formReclamo" method="POST"
      action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00D06000001Tz0T" novalidate>

      <input type="hidden" name="orgid" value="00D06000001Tz0T" />
      <input type="hidden" name="retURL" value="" />

      <input type="hidden" name="captcha_settings"
        value='{"keyname":"captchatplv2","fallback":"true","orgId":"00D06000001Tz0T","ts":""}'>

      <fieldset>
        <legend><span id="label_legendanagrafica"></span></legend>

        <label for="00NbU0000001klf" id="label_cognome"></label>
        <input id="00NbU0000001klf" name="00NbU0000001klf" type="text" />

        <label for="email" id="label_mail">Email:</label>
        <input id="email" maxlength="80" name="email" size="20" />

        <label for="00NbU0000002837" id="label_prefissotelefonico"></label>

        </select>

        <label for="00NbU0000001klo" id="label_numerotelefonico"></label>

      </fieldset>

      <fieldset>
        <legend><span id="label_legendaabbonamento"></span></legend>

        <label for="00NbU0000001kls" id="label_numerotesserinoidentificativo"></label>
        <input id="00NbU0000001kls" name="00NbU0000001kls" type="text" />

        <!-- These three fields must still be created in Salesforce; replace their provisional ids and names afterward. -->
        <label for="intestatario_nome" id="label_nomeintestatario"></label>
        <input id="intestatario_nome" name="intestatario_nome" type="text" />

        <label for="intestatario_cognome" id="label_cognomeintestatario"></label>
        <input id="intestatario_cognome" name="intestatario_cognome" type="text" />

        <label for="percorso_abbonamento" id="label_percorsoabbonamento"></label>
        <input id="percorso_abbonamento" maxlength="255" name="percorso_abbonamento" type="text" />
      </fieldset>

      <fieldset>
        <legend><span id="label_legendasoluzione"></span></legend>

        <label for="description" id="label_descrizione"></label>
        <em>
          <span id='label_introdescrizione'></span>
        </em>
        <br>
        <br>
        <textarea id="description" name="description" rows="10" maxlength="30000"></textarea>
      </fieldset>

      <fieldset>
        <legend><span id="label_consensoobbligatorio"></span></legend>

        <label for="00NbU0000000KEr" id="label_privacy"></label>
        <select id="00NbU0000000KEr" name="00NbU0000000KEr" class="toggle-consenso-select" data-iniziale="si">
          <option value="">--</option>
          <option value="Si/Yes">Sì/Yes</option>
          <option value="No">No</option>
        </select><br>
      </fieldset>

      <fieldset>
        <legend><span id="label_consensofacoltativo"></span></legend>

        <label for="00NbU0000002hs5" id="label_indaginidemoscopiche"></label>
        <select id="00NbU0000002hs5" name="00NbU0000002hs5" class="toggle-consenso-select" data-iniziale="no">
          <option value="">--</option>
          <option value="Si/Yes">Sì/Yes</option>
          <option value="No">No</option>
        </select>

        <label for="00NbU0000002hth" id="label_attivitacommerciali"></label>
        <select id="00NbU0000002hth" name="00NbU0000002hth" class="toggle-consenso-select" data-iniziale="no">
          <option value="">--</option>
          <option value="Si/Yes">Sì/Yes</option>
          <option value="No">No</option>
        </select>

        <label for="00NbU0000002hvJ" id="label_analisipreferenze"></label>
        <select id="00NbU0000002hvJ" name="00NbU0000002hvJ" class="toggle-consenso-select" data-iniziale="no">
          <option value="">--</option>
          <option value="Si/Yes">Sì/Yes</option>
          <option value="No">No</option>
        </select>

        <label for="00NbU0000002hwv" id="label_comunicazionepartner"></label>
        <select id="00NbU0000002hwv" name="00NbU0000002hwv" class="toggle-consenso-select" data-iniziale="no">
          <option value="">--</option>
          <option value="Si/Yes">Sì/Yes</option>
          <option value="No">No</option>
        </select>

        <label for="00NbU0000002yOH" id="label_cessioneterzi"></label>
        <select id="00NbU0000002yOH" name="00NbU0000002yOH" class="toggle-consenso-select" data-iniziale="no" title="Acconsente cessione terzi">
          <option value="">--</option>
          <option value="Si/Yes">Sì/Yes</option>
          <option value="No">No</option>
        </select>
      </fieldset>

      <fieldset>
        <label for="00NbU0000005bQL" id="label_camporiservatotplfvg"></label>
        <input id="00NbU0000005bQL" maxlength="255" name="00NbU0000005bQL" size="20" type="text" /><br>
      </fieldset>

      <!--flag autorizzazione scuole-->
      <input id="00NbU000000cASz" name="00NbU000000cASz" type="hidden" value="1" />
      <input id="00NbU0000004ild" name="00NbU0000004ild" type="hidden" />
      <input type="hidden" id="external" name="external" value="1" /><br>
      <br>

      <div class="g-recaptcha" data-sitekey="6LcKTugqAAAAAB9mkWg5p3floGYNeNVAXY6Z6c8P"></div><br>
      <div id="captchaError" class="error-message" style="display: none;"></div>

      <input type="submit" id="submitBtn" value="Invia richiesta" />
    </form>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const retUrlInput = document.querySelector('input[name="retURL"]');
      if (retUrlInput) {
        const currentUrl = window.location.href;
        const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf("/") + 1);
        retUrlInput.value = baseUrl + "grazie.html";
      }
    });
  </script>
  <script src="toggleConsensi.js"></script>
</body>

</html>
